<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>struct-map 数据流</title>
<style>
  html,body{margin:0;background:#fff;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1c2128}
  .wrap{padding:18px;width:960px}
</style>
</head>
<body>
<div class="wrap">
<svg width="924" height="470" viewBox="0 0 924 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b95a3"/>
    </marker>
  </defs>

  <!-- ===== band 1: code ===== -->
  <rect x="1" y="8" width="922" height="132" rx="10" fill="none" stroke="#1f6feb" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="9" y="13" width="112" height="21" rx="5" fill="#fff"/>
  <text x="16" y="29" font-size="13" font-weight="600" fill="#1f6feb">代码</text>
  <text x="132" y="29" font-size="9.5" fill="#6b7683">两块，各管一半</text>

  <g>
    <rect x="24" y="46" width="196" height="62" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="37" y="68" font-size="13" font-weight="600">index.js · 宿主</text>
    <text x="37" y="86" font-size="9.5" fill="#5b6672">扫工作区，两个只读接口</text>
    <text x="37" y="100" font-size="9.5" fill="#5b6672">不写盘、不改数据</text>
  </g>

  <path d="M228 77 H316" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="272" y="68" font-size="9.5" fill="#3d4753" text-anchor="middle">HTTP</text>

  <g>
    <rect x="324" y="46" width="216" height="62" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="337" y="68" font-size="13" font-weight="600">client.js · 浏览器包</text>
    <text x="337" y="86" font-size="9.5" fill="#5b6672">生成的，不要手改</text>
    <text x="337" y="100" font-size="9.5" fill="#5b6672">= layout.mjs + shell.js</text>
  </g>

  <path d="M616 77 H556" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="586" y="68" font-size="9.5" fill="#3d4753" text-anchor="middle">build.mjs</text>

  <g>
    <rect x="624" y="46" width="132" height="62" rx="7" fill="#eef4fd" stroke="#1f6feb" stroke-width="1.4"/>
    <text x="637" y="68" font-size="13" font-weight="600" fill="#1f6feb">layout.mjs</text>
    <text x="637" y="86" font-size="9.5" fill="#5b6672">布局唯一真源</text>
  </g>
  <g>
    <rect x="772" y="46" width="136" height="62" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="785" y="68" font-size="13" font-weight="600">shell.js</text>
    <text x="785" y="86" font-size="9.5" fill="#5b6672">React 面板</text>
    <text x="785" y="100" font-size="9.5" fill="#5b6672">拉取 / 测量 / 交互</text>
  </g>
  <text x="624" y="128" font-size="9.5" fill="#6b7683">改布局只改 layout.mjs，跑 node build.mjs</text>

  <!-- ===== band 2: runtime ===== -->
  <rect x="1" y="158" width="922" height="204" rx="10" fill="none" stroke="#15803d" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="9" y="163" width="112" height="21" rx="5" fill="#fff"/>
  <text x="16" y="179" font-size="13" font-weight="600" fill="#15803d">一次重绘</text>
  <text x="132" y="179" font-size="9.5" fill="#6b7683">每次文件变、宽度变，整条重跑，不缓存坐标</text>

  <g>
    <rect x="24" y="196" width="150" height="70" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="37" y="217" font-size="13" font-weight="600">*.struct.json</text>
    <text x="37" y="235" font-size="9.5" fill="#5b6672">组 / 方块 / 边 / 注释</text>
    <text x="37" y="249" font-size="9.5" fill="#5b6672">没有坐标、没有行列号</text>
  </g>

  <path d="M182 231 H232" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="207" y="222" font-size="9.5" fill="#3d4753" text-anchor="middle">data</text>

  <g>
    <rect x="240" y="196" width="150" height="70" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="253" y="217" font-size="13" font-weight="600">layout()</text>
    <text x="253" y="235" font-size="9.5" fill="#5b6672">十个阶段，纯函数</text>
    <text x="253" y="249" font-size="9.5" fill="#5b6672">→ 坐标 / 路径 / 标签位</text>
  </g>

  <path d="M398 231 H448" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="423" y="222" font-size="9.5" fill="#3d4753" text-anchor="middle">lay</text>

  <g>
    <rect x="456" y="196" width="150" height="70" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="469" y="217" font-size="13" font-weight="600">check()</text>
    <text x="469" y="235" font-size="9.5" fill="#5b6672">11 条硬规则 + 2 条警告</text>
    <text x="469" y="249" font-size="9.5" fill="#5b6672">→ violations / warnings</text>
  </g>

  <path d="M614 231 H664" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="639" y="222" font-size="9.5" fill="#3d4753" text-anchor="middle">lay</text>

  <g>
    <rect x="672" y="196" width="102" height="70" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="685" y="217" font-size="13" font-weight="600">svg()</text>
    <text x="685" y="235" font-size="9.5" fill="#5b6672">→ 一个字符串</text>
  </g>

  <path d="M782 231 H816" fill="none" stroke="#8b95a3" stroke-width="1.3" marker-end="url(#a)"/>

  <g>
    <rect x="824" y="196" width="84" height="70" rx="7" fill="#f6f7f9" stroke="#dde1e7" stroke-width="1.2"/>
    <text x="835" y="217" font-size="13" font-weight="600">面板</text>
    <text x="835" y="235" font-size="9.5" fill="#5b6672">右侧栏</text>
  </g>

  <!-- violations path down to the red strip -->
  <path d="M531 266 V300" fill="none" stroke="#c2410c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <g>
    <rect x="392" y="302" width="278" height="26" rx="6" fill="#fff" stroke="#c2410c" stroke-width="1.1" stroke-opacity="0.7"/>
    <text x="404" y="319" font-size="10" fill="#c2410c">有违规 → 面板顶部红条，点名具体的边</text>
  </g>
  <g>
    <rect x="690" y="302" width="234" height="26" rx="6" fill="#fff" stroke="#15803d" stroke-width="1.1" stroke-opacity="0.7"/>
    <text x="702" y="319" font-size="10" fill="#15803d">零违规 → 只出图，不打扰</text>
  </g>

  <text x="24" y="292" font-size="10" fill="#5b6672">点击方块 → 只留它和它的邻边（其余淡出）</text>
  <text x="24" y="312" font-size="10" fill="#5b6672">颜色键：kind → 标签 → 边自身</text>
  <text x="24" y="332" font-size="10" fill="#5b6672">图例由实际用到的颜色键生成</text>

  <!-- ===== footer: invariants ===== -->
  <rect x="1" y="382" width="922" height="76" rx="10" fill="none" stroke="#c9ced6" stroke-width="1.2" stroke-dasharray="7 5"/>
  <rect x="9" y="387" width="112" height="21" rx="5" fill="#fff"/>
  <text x="16" y="403" font-size="13" font-weight="600" fill="#5b6672">四条不变量</text>
  <text x="24" y="424" font-size="10" fill="#3d4753">① 数据里没有布局　② 同输入同输出（无随机、无时间）</text>
  <text x="24" y="444" font-size="10" fill="#3d4753">③ 检查不过不静默　④ 渲染器不认识任何业务词</text>
</svg>
</div>
</body>
</html>
